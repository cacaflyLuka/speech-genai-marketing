#grid svg { width:100%; height:auto; display:block; pointer-events:none; }

@media print {

  <title>不要用 1–5 分</title>
  <desc>Likert 分數與二元 rubric 的對照。</desc>
  <!-- 由 talk/build_slides.py 產生，不要手改 -->
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="76" y="97" font-size="38" fill="#1A1A1A" font-weight="700">LLM as judge：不要用 1–5 分</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">把一個模糊的大問題，拆成一組可檢查的 yes/no 小問題</text>
  <rect x="76.0" y="196" width="544.0" height="372" rx="10" fill="#ffffff" stroke="#B8B8B8" stroke-width="2.5"/>
  <text x="104.0" y="242" font-size="26" fill="#8A8A8A" font-weight="700">1–5 分</text>
  <text x="592.0" y="240" font-size="17" fill="#8A8A8A" font-weight="700" text-anchor="end">不要</text>
  <text x="104.0" y="284" font-size="20" fill="#4A4A4A">「這份文案的品質有幾分？」</text>
  <text x="104.0" y="332" font-size="20" fill="#4A4A4A">→ 3.8 / 5</text>
  <text x="104.0" y="380" font-size="20" fill="#B3261E" font-weight="700">✗</text>
  <text x="128.0" y="380" font-size="20" fill="#4A4A4A">分數擠在 3–4 分</text>
  <text x="104.0" y="414" font-size="20" fill="#B3261E" font-weight="700">✗</text>
  <text x="128.0" y="414" font-size="20" fill="#4A4A4A">今天 4 分明天 3 分</text>
  <text x="104.0" y="448" font-size="20" fill="#B3261E" font-weight="700">✗</text>
  <text x="128.0" y="448" font-size="20" fill="#4A4A4A">換評審模型整組平移</text>
  <text x="104.0" y="482" font-size="20" fill="#B3261E" font-weight="700">✗</text>
  <text x="128.0" y="482" font-size="20" fill="#4A4A4A">寫得長就拿高分</text>
  <text x="104.0" y="516" font-size="20" fill="#B3261E" font-weight="700">✗</text>
  <text x="128.0" y="516" font-size="20" fill="#4A4A4A">「3.8 分」無法行動</text>
  <rect x="660.0" y="196" width="544.0" height="372" rx="10" fill="#CDEBD4" stroke="#166534" stroke-width="2.5"/>

  <title>成本估算公式與降本四招</title>
  <desc>生成式 AI 的成本估算公式，以及四種降低成本的手段與其代價</desc>

  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="76" y="97" font-size="38" font-weight="700" fill="#1A1A1A">成本：用公式，不背數字</text>

  <!-- ============ 公式 ============ -->
  <rect x="76" y="140" width="1128" height="150" rx="12" fill="#F5F5F5" stroke="#D8D8D8" stroke-width="2"/>

  <text x="108" y="178" font-size="16" font-weight="700" fill="#8A8A8A">單次成本</text>
  <text x="108" y="214" font-size="23" fill="#1A1A1A" font-family="'SF Mono','Menlo','Consolas',monospace">( in_tokens × 單價_in&#160;&#160;+&#160;&#160;out_tokens × 單價_out ) ÷ 1,000,000</text>

  <line x1="108" y1="236" x2="1172" y2="236" stroke="#D8D8D8" stroke-width="1.5"/>

  <text x="108" y="262" font-size="16" font-weight="700" fill="#8A8A8A">月成本</text>
  <text x="108" y="284" font-size="22" fill="#1A1A1A" font-family="'SF Mono','Menlo','Consolas',monospace">單次 × SKU數 × 重生成次數 × ( 1 + <tspan fill="#C2510A" font-weight="700">judge 開銷比</tspan> )</text>

  <!-- 實測數字，不是勸說 -->
  <rect x="76" y="306" width="1128" height="54" rx="10" fill="#FBEADF" stroke="#EFB183" stroke-width="2"/>
  <text x="640" y="341" font-size="23" fill="#8A3A06" text-anchor="middle">
    <tspan font-weight="700">實測：評審佔總成本 83%</tspan><tspan dx="22">最常被漏算的一筆</tspan>
  </text>

  <!-- ============ 降本四招 ============ -->
  <text x="76" y="416" font-size="28" font-weight="700" fill="#1A1A1A">降本四招</text>

  <text x="96" y="452" font-size="15" font-weight="700" fill="#B8B8B8">手段</text>
  <text x="372" y="452" font-size="15" font-weight="700" fill="#B8B8B8">省下</text>
  <text x="790" y="452" font-size="15" font-weight="700" fill="#B8B8B8">代價</text>

  <g>
    <rect x="76" y="466" width="1128" height="56" rx="8" fill="#F5F5F5"/>
    <text x="96" y="502" font-size="21" font-weight="600" fill="#1A1A1A">1　模型選型降級</text>
    <rect x="372" y="484" width="200" height="21" rx="5" fill="#EF7622"/>
    <text x="588" y="502" font-size="17" fill="#A85110">最大一筆</text>
    <text x="790" y="502" font-size="18" font-weight="700" fill="#8A3A06">要有評測表才敢降</text>
  </g>

  <g>
    <rect x="76" y="528" width="1128" height="56" rx="8" fill="#ffffff"/>
    <text x="96" y="564" font-size="21" font-weight="600" fill="#1A1A1A">2　Batch API</text>
    <rect x="372" y="546" width="130" height="21" rx="5" fill="#EF7622"/>
    <text x="588" y="564" font-size="17" fill="#A85110">約 5 折</text>
    <text x="790" y="564" font-size="18" fill="#4A4A4A">延遲變小時級</text>
  </g>

  <g>
    <rect x="76" y="590" width="1128" height="56" rx="8" fill="#F5F5F5"/>
    <text x="96" y="626" font-size="21" font-weight="600" fill="#1A1A1A">3　Context caching</text>
    <rect x="372" y="608" width="102" height="21" rx="5" fill="#EF7622"/>
    <text x="588" y="626" font-size="17" fill="#A85110">input 折扣</text>
    <text x="790" y="626" font-size="18" fill="#4A4A4A">前綴要夠長</text>
  </g>

  <g>
    <rect x="76" y="652" width="960" height="52" rx="8" fill="#FDF1E6" stroke="#F8C99A" stroke-width="2"/>
    <text x="96" y="686" font-size="21" font-weight="600" fill="#1A1A1A">4　結果快取</text>
    <rect x="372" y="668" width="170" height="21" rx="5" fill="#EF7622"/>
    <text x="588" y="686" font-size="17" font-weight="700" fill="#C2510A">最被低估</text>
    <text x="790" y="686" font-size="18" fill="#4A4A4A">幾乎沒有</text>
  </g>
</svg></section><section class="slide" data-name="eval-costs-money.svg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">

</svg></section><section class="slide" data-name="gcp-architecture.svg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">

  <text x="196" y="420" font-size="15" fill="#4A4A4A" text-anchor="middle">Gemini 評審（2.5-pro）</text>
  <text x="196" y="444" font-size="14" fill="#C2510A" text-anchor="middle">structured output</text>

  <text x="436" y="398" font-size="15" fill="#4A4A4A" text-anchor="middle">純 Python，不呼叫模型</text>
  <text x="436" y="420" font-size="15" fill="#4A4A4A" text-anchor="middle">禁詞、長度、schema</text>
  <text x="436" y="444" font-size="14" fill="#1B6FB8" text-anchor="middle">零成本 · 可進 CI</text>

  <rect x="556" y="340" width="200" height="118" rx="10" fill="#FDF1E6" stroke="#EF7622" stroke-width="2.5"/>
  <text x="656" y="372" font-size="19" font-weight="700" fill="#A85110" text-anchor="middle">BigQuery</text>

  <text x="656" y="420" font-size="15" fill="#4A4A4A" text-anchor="middle">分區 + 叢集</text>
  <text x="656" y="444" font-size="14" fill="#C2510A" text-anchor="middle">場景 B（選用）</text>

  <rect x="776" y="340" width="200" height="118" rx="10" fill="#ffffff" stroke="#B8B8B8" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="876" y="420" font-size="15" fill="#8A8A8A" text-anchor="middle">供 PIM 後台呼叫</text>
  <text x="876" y="444" font-size="14" fill="#B8B8B8" text-anchor="middle">今天用 notebook 代替</text>

  <rect x="996" y="340" width="208" height="118" rx="10" fill="#ffffff" stroke="#B8B8B8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1100" y="372" font-size="19" font-weight="700" fill="#6A6A6A" text-anchor="middle">Batch Prediction</text>

  <title>90 天導入路徑</title>

  <!-- 由 talk/build_slides.py 產生，不要手改 -->
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="76" y="97" font-size="38" fill="#1A1A1A" font-weight="700">90 天導入路徑</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">順序不能反過來 —— 先解決「怎麼知道它變好了」</text>
  <circle cx="94" cy="218" r="18" fill="#1B6FB8"/>
  <text x="94" y="225" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>

  <text x="1204" y="220" font-size="20" fill="#1B6FB8" font-weight="700" text-anchor="end">2 週</text>

<div id="bar"></div>
<div id="hud"></div>
<div id="help">← → 換頁　F 全螢幕　O 總覽</div>
<script>
const slides = [...document.querySelectorAll('.slide')];
const grid = document.getElementById('grid');
const bar = document.getElementById('bar');
const hud = document.getElementById('hud');
let i = 0;

function show(n) {
  i = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, k) => s.classList.toggle('on', k === i));
  bar.style.width = ((i + 1) / slides.length * 100) + '%';
  hud.innerHTML = '<b>' + (i + 1) + '</b> / ' + slides.length;
  [...grid.children].forEach((f, k) => f.classList.toggle('cur', k === i));
  if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
}
function toggleGrid(force) {
  const on = force ?? !grid.classList.contains('on');
  grid.classList.toggle('on', on);
  if (on) [...grid.children][i]?.scrollIntoView({block: 'center'});
}
function fullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') {
    show(i + 1); toggleGrid(false); e.preventDefault();
  } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') {
    show(i - 1); toggleGrid(false); e.preventDefault();
  } else if (k === 'Home') { show(0); }
  else if (k === 'End') { show(slides.length - 1); }
  else if (k === 'f' || k === 'F') { fullscreen(); }
  else if (k === 'o' || k === 'O' || k === 'Escape') { toggleGrid(); }
});

// 點右半邊下一頁、左半邊上一頁 —— 沒有簡報筆的時候用得到
addEventListener('click', e => {
  if (grid.classList.contains('on')) return;
  show(e.clientX > innerWidth / 2 ? i + 1 : i - 1);
});
[...grid.children].forEach((f, k) => f.addEventListener('click', ev => {
  ev.stopPropagation(); show(k); toggleGrid(false);
}));

// 觸控滑動
let x0 = null;
addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, {passive: true});
addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 48) show(dx < 0 ? i + 1 : i - 1);
  x0 = null;
}, {passive: true});

show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
</script>
