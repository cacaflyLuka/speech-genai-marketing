<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">
  <title>v3：結構化輸出</title>
  <desc>v3 用 responseSchema 約束輸出格式，而不是在 prompt 裡拜託模型。</desc>
  <!-- 由 talk/build_slides.py 產生，不要手改 -->
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="76" y="97" font-size="38" fill="#1A1A1A" font-weight="700">v3　結構化輸出</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">唯一的差別是多了 responseSchema</text>
  <rect x="76.0" y="225.24" width="548.0" height="296" rx="10" fill="#ffffff" stroke="#D8D8D8" stroke-width="2.5"/>
  <rect x="76.0" y="225.24" width="548.0" height="44" rx="10" fill="#F5F5F5" stroke="none" stroke-width="2"/>
  <text x="96.0" y="255.24" font-size="20" fill="#8A8A8A" font-weight="700">不要這樣做</text>
  <text x="96.0" y="303.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">prompt 裡寫：</text>
  <rect x="88.0" y="311.24" width="524.0" height="24" rx="4" fill="#F5F5F5" stroke="none" stroke-width="2"/>
  <text x="96.0" y="327.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  "請以 JSON 格式輸出"</text>
  <text x="96.0" y="351.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace"></text>
  <text x="96.0" y="375.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">模型會照做九成的時間。</text>
  <text x="96.0" y="399.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">剩下那一成，</text>
  <text x="96.0" y="423.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">你的 parser 就掛了。</text>
  <rect x="656.0" y="225.24" width="548.0" height="296" rx="10" fill="#ffffff" stroke="#166534" stroke-width="2.5"/>
  <rect x="656.0" y="225.24" width="548.0" height="44" rx="10" fill="#CDEBD4" stroke="none" stroke-width="2"/>
  <text x="676.0" y="255.24" font-size="20" fill="#0F4A25" font-weight="700">要這樣做</text>
  <rect x="668.0" y="287.24" width="524.0" height="24" rx="4" fill="#CDEBD4" stroke="none" stroke-width="2"/>
  <text x="676.0" y="303.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">response_schema = {</text>
  <rect x="668.0" y="311.24" width="524.0" height="24" rx="4" fill="#CDEBD4" stroke="none" stroke-width="2"/>
  <text x="676.0" y="327.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  "title":   str,  # ≤60</text>
  <rect x="668.0" y="335.24" width="524.0" height="24" rx="4" fill="#CDEBD4" stroke="none" stroke-width="2"/>
  <text x="676.0" y="351.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  "bullets": [str] * 4,</text>
  <rect x="668.0" y="359.24" width="524.0" height="24" rx="4" fill="#CDEBD4" stroke="none" stroke-width="2"/>
  <text x="676.0" y="375.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  "seo_desc": str, # ≤120</text>
  <rect x="668.0" y="383.24" width="524.0" height="24" rx="4" fill="#CDEBD4" stroke="none" stroke-width="2"/>
  <text x="676.0" y="399.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">}</text>
  <text x="676.0" y="423.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace"></text>
  <text x="676.0" y="447.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">模型被解碼器約束在 schema 內。</text>
  <text x="676.0" y="471.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">那一成的失敗會消失。</text>
  <line x1="76" y1="555.24" x2="1204" y2="555.24" stroke="#D8D8D8" stroke-width="1.5"/>
  <text x="76" y="591.24" font-size="21" fill="#8A8A8A">可機器讀取：0% → 100%。這不需要統計檢定。</text>
</svg>
