<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">
  <title>90 天導入路徑</title>
  <desc>三個階段各自的產出與時間。</desc>
  <!-- 由 talk/build_slides.py 產生，不要手改 -->
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="76" y="97" font-size="38" fill="#1A1A1A" font-weight="700">90 天導入路徑</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">順序不能反過來 —— 先解決「怎麼知道它變好了」</text>
  <circle cx="94" cy="218" r="18" fill="#1B6FB8"/>
  <text x="94" y="225" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="132" y="214" font-size="26" fill="#1A1A1A" font-weight="700">GEAP Studio 驗證可行性</text>
  <text x="132" y="246" font-size="19" fill="#4A4A4A">這件事到底做不做得成</text>
  <text x="1204" y="220" font-size="20" fill="#1B6FB8" font-weight="700" text-anchor="end">2 週</text>
  <circle cx="94" cy="310" r="18" fill="#1B6FB8"/>
  <text x="94" y="317" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="132" y="306" font-size="26" fill="#1A1A1A" font-weight="700">建 golden set + API 串接</text>
  <text x="132" y="338" font-size="19" fill="#4A4A4A">30–50 筆就足以開始</text>
  <text x="1204" y="312" font-size="20" fill="#1B6FB8" font-weight="700" text-anchor="end">4 週</text>
  <circle cx="94" cy="402" r="18" fill="#1B6FB8"/>
  <text x="94" y="409" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="132" y="398" font-size="26" fill="#1A1A1A" font-weight="700">小流量上線 + 監控</text>
  <text x="132" y="430" font-size="19" fill="#4A4A4A">有數字可以對董事會報告</text>
  <text x="1204" y="404" font-size="20" fill="#1B6FB8" font-weight="700" text-anchor="end">6 週</text>
  <line x1="76" y1="604" x2="1204" y2="604" stroke="#D8D8D8" stroke-width="1.5"/>
  <text x="76" y="638" font-size="21" fill="#8A8A8A">golden set 不用大。50 筆 × 7 條判準，就足以分辨 3 個百分點以上的差距。</text>
</svg>
