<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">
  <title>三層評測</title>
  <desc>由便宜到貴的三層評測：規則層、LLM judge、人工抽樣，含各層成本與延遲</desc>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B6FB8"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="76" y="97" font-size="38" font-weight="700" fill="#1A1A1A">三層評測：由便宜到貴</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">順序很重要</text>

  <!-- ============ 金字塔 ============ -->
  <path d="M 500 186 L 620 186 L 670 292 L 450 292 Z" fill="#F7D4BC" stroke="#C2510A" stroke-width="2.5"/>
  <text x="560" y="244" font-size="25" font-weight="700" fill="#8A3A06" text-anchor="middle">人工抽樣</text>

  <path d="M 450 296 L 670 296 L 730 420 L 390 420 Z" fill="#FBE0C6" stroke="#EF7622" stroke-width="2.5"/>
  <text x="560" y="352" font-size="25" font-weight="700" fill="#A85110" text-anchor="middle">LLM as judge</text>
  <text x="560" y="388" font-size="18" fill="#C45E12" text-anchor="middle">語調、賣點覆蓋</text>

  <path d="M 390 424 L 730 424 L 800 580 L 320 580 Z" fill="#DCEAF8" stroke="#1B6FB8" stroke-width="2.5"/>
  <text x="560" y="482" font-size="27" font-weight="700" fill="#12507F" text-anchor="middle">規則層</text>
  <text x="560" y="518" font-size="18" fill="#1B6FB8" text-anchor="middle">長度、格式、必含規格</text>
  <text x="560" y="548" font-size="19" font-weight="700" fill="#12507F" text-anchor="middle">法規禁詞</text>

  <text x="180" y="490" font-size="23" font-weight="700" fill="#1B6FB8" text-anchor="middle">先建</text>
  <text x="180" y="522" font-size="23" font-weight="700" fill="#1B6FB8" text-anchor="middle">這一層</text>
  <line x1="248" y1="512" x2="336" y2="512" stroke="#1B6FB8" stroke-width="3" marker-end="url(#a2)"/>

  <!-- ============ 右側屬性 ============ -->
  <g>
    <text x="880" y="196" font-size="17" font-weight="700" fill="#8A8A8A">成本</text>
    <text x="1050" y="196" font-size="17" font-weight="700" fill="#8A8A8A">延遲</text>

    <line x1="680" y1="240" x2="860" y2="240" stroke="#EDEDED" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="880" y="248" font-size="21" font-weight="700" fill="#C2510A">最貴</text>
    <text x="1050" y="248" font-size="21" fill="#4A4A4A">天</text>

    <line x1="712" y1="364" x2="860" y2="364" stroke="#EDEDED" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="880" y="372" font-size="21" font-weight="700" fill="#EF7622">中</text>
    <text x="1050" y="372" font-size="21" fill="#4A4A4A">秒</text>

    <line x1="782" y1="500" x2="860" y2="500" stroke="#EDEDED" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="880" y="508" font-size="21" font-weight="700" fill="#1B6FB8">免費</text>
    <text x="1050" y="508" font-size="21" fill="#4A4A4A">毫秒</text>
  </g>

  <!-- ============ 實測數字 ============ -->
  <rect x="76" y="614" width="1128" height="62" rx="10" fill="#FBEADF" stroke="#EFB183" stroke-width="2"/>
  <text x="640" y="654" font-size="24" fill="#8A3A06" text-anchor="middle">
    <tspan font-weight="700">評審佔總成本 83%</tspan><tspan dx="22">—— 50 筆實測</tspan>
  </text>
</svg>
