<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">
  <title>v0：什麼都不給</title>
  <desc>最常見的第一版 prompt，以及它實際產生的東西。</desc>
  <!-- 由 talk/build_slides.py 產生，不要手改 -->
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="76" y="97" font-size="38" fill="#1A1A1A" font-weight="700">v0　什麼都不給</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">大多數人第一次寫的 prompt：一句話加商品資料</text>
  <rect x="76.0" y="225.24" width="548.0" height="296" rx="10" fill="#ffffff" stroke="#D8D8D8" stroke-width="2.5"/>
  <rect x="76.0" y="225.24" width="548.0" height="44" rx="10" fill="#F5F5F5" stroke="none" stroke-width="2"/>
  <text x="96.0" y="255.24" font-size="20" fill="#8A8A8A" font-weight="700">v0 prompt</text>
  <text x="96.0" y="303.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">幫我寫這個商品的電商文案。</text>
  <text x="96.0" y="327.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace"></text>
  <text x="96.0" y="351.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">商品：晨光研選 金盞花萃取葉黃素膠囊 60粒</text>
  <text x="96.0" y="375.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">品類：保健食品 / 眼部保養</text>
  <text x="96.0" y="399.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">規格：</text>
  <text x="96.0" y="423.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  - 淨含量：60粒 / 盒</text>
  <text x="96.0" y="447.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  - 主成分：游離型葉黃素 30mg、玉米黃素 6mg</text>
  <text x="96.0" y="471.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  - 劑型：植物膠囊</text>
  <rect x="656.0" y="225.24" width="548.0" height="296" rx="10" fill="#ffffff" stroke="#D8D8D8" stroke-width="2.5"/>
  <rect x="656.0" y="225.24" width="548.0" height="44" rx="10" fill="#F5F5F5" stroke="none" stroke-width="2"/>
  <text x="676.0" y="255.24" font-size="20" fill="#8A8A8A" font-weight="700">產出</text>
  <text x="676.0" y="303.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">## 晨光研選｜金盞花萃取葉黃素膠囊 電商文案</text>
  <text x="676.0" y="327.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">### 一、標題與短文案</text>
  <text x="676.0" y="351.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">| 類型 | 文案內容 | 訴求重點 |</text>
  <text x="676.0" y="375.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">| 主標題 | 【晨光研選】高濃度游離型葉黃素⋯⋯</text>
  <text x="676.0" y="399.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">| 短文案 | 每日一粒，告別模糊！⋯⋯</text>
  <text x="676.0" y="423.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">### 二、長文案（商品詳情頁）</text>
  <text x="676.0" y="447.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">您是否面臨這些困擾？</text>
  <text x="676.0" y="471.24" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">長時間面對手機、電腦，感到疲勞乾澀？</text>
  <line x1="76" y1="555.24" x2="1204" y2="555.24" stroke="#D8D8D8" stroke-width="1.5"/>
  <text x="76" y="591.24" font-size="21" fill="#8A8A8A">什麼都沒說，模型就自己決定 —— 可能會踩到法規。</text>
</svg>
