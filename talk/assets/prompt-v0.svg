<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">
  <title>v0：什麼都不給</title>
  <desc>最常見的第一版 prompt，以及它產生的文案。</desc>
  <!-- 由 talk/build_slides.py 產生，不要手改 -->
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="76" y="97" font-size="38" fill="#1A1A1A" font-weight="700">v0　什麼都不給</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">大多數人第一次寫的 prompt</text>
  <rect x="76.0" y="249.72" width="548.0" height="224" rx="10" fill="#ffffff" stroke="#D8D8D8" stroke-width="2.5"/>
  <rect x="76.0" y="249.72" width="548.0" height="44" rx="10" fill="#F5F5F5" stroke="none" stroke-width="2"/>
  <text x="96.0" y="279.72" font-size="20" fill="#8A8A8A" font-weight="700">prompt</text>
  <text x="96.0" y="327.72" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">請幫這個商品寫一段</text>
  <text x="96.0" y="351.72" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">電商文案。</text>
  <text x="96.0" y="375.72" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace"></text>
  <text x="96.0" y="399.72" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">商品：游離型葉黃素</text>
  <text x="96.0" y="423.72" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">　　　30mg／30粒</text>
  <rect x="656.0" y="249.72" width="548.0" height="224" rx="10" fill="#ffffff" stroke="#D8D8D8" stroke-width="2.5"/>
  <rect x="656.0" y="249.72" width="548.0" height="44" rx="10" fill="#F5F5F5" stroke="none" stroke-width="2"/>
  <text x="676.0" y="279.72" font-size="20" fill="#8A8A8A" font-weight="700">產出</text>
  <text x="676.0" y="327.72" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">守護您的靈魂之窗！</text>
  <text x="676.0" y="351.72" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">現代人３Ｃ不離身⋯⋯</text>
  <text x="676.0" y="375.72" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">有效改善視力模糊、</text>
  <text x="676.0" y="399.72" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">預防眼部疾病，</text>
  <text x="676.0" y="423.72" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">重拾清晰視界！</text>
  <line x1="76" y1="507.72" x2="1204" y2="507.72" stroke="#D8D8D8" stroke-width="1.5"/>
  <text x="76" y="543.72" font-size="21" fill="#8A8A8A">文筆很好。但它不能用 —— 長度不知道、規格沒寫、而且踩了法規。</text>
</svg>
