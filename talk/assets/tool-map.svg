<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">
  <title>GCP 生成式 AI 三層工具地圖</title>
  <desc>依專案階段（探索／整合／上線）而非產品線劃分的 GCP 生成式 AI 工具地圖</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8A8A"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="76" y="97" font-size="38" font-weight="700" fill="#1A1A1A">GCP 生成式 AI：三層工具地圖</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">依你在哪個階段劃分，不是依產品線</text>

  <!-- ===================== 1 探索期 ===================== -->
  <g>
    <rect x="76" y="192" width="360" height="300" rx="14" fill="#E9F2FB" stroke="#A9CDEE" stroke-width="2"/>
    <rect x="76" y="192" width="360" height="6" rx="3" fill="#1B6FB8"/>

    <circle cx="114" cy="242" r="20" fill="#1B6FB8"/>
    <text x="114" y="250" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="148" y="250" font-size="28" font-weight="700" fill="#12507F">探索期</text>
    <text x="262" y="249" font-size="18" fill="#1B6FB8">約 2 週</text>

    <text x="104" y="308" font-size="23" font-weight="600" fill="#1A1A1A">Vertex AI Studio</text>
    <text x="104" y="342" font-size="18" fill="#4A4A4A">瀏覽器打開就能用</text>
    <text x="104" y="372" font-size="18" fill="#4A4A4A">改 prompt、比模型、調參數</text>

    <line x1="104" y1="404" x2="408" y2="404" stroke="#A9CDEE" stroke-width="1.5"/>
    <text x="104" y="440" font-size="16" font-weight="700" fill="#1B6FB8">要回答的問題</text>
    <text x="104" y="470" font-size="20" fill="#1A1A1A">做不做得成？</text>
  </g>

  <!-- ===================== 2 整合期 ===================== -->
  <g>
    <rect x="460" y="192" width="360" height="300" rx="14" fill="#FDF1E6" stroke="#F8C99A" stroke-width="2"/>
    <rect x="460" y="192" width="360" height="6" rx="3" fill="#EF7622"/>

    <circle cx="498" cy="242" r="20" fill="#EF7622"/>
    <text x="498" y="250" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="532" y="250" font-size="28" font-weight="700" fill="#A85110">整合期</text>
    <text x="646" y="249" font-size="18" fill="#EF7622">約 4 週</text>

    <text x="488" y="308" font-size="23" font-weight="600" fill="#1A1A1A">Gemini API / Vertex AI</text>
    <text x="488" y="342" font-size="18" fill="#4A4A4A">prompt 變成程式碼</text>
    <text x="488" y="372" font-size="18" fill="#4A4A4A">structured output 接進系統</text>

    <line x1="488" y1="404" x2="792" y2="404" stroke="#F8C99A" stroke-width="1.5"/>
    <text x="488" y="440" font-size="16" font-weight="700" fill="#C45E12">要回答的問題</text>
    <text x="488" y="470" font-size="20" fill="#1A1A1A">能不能貼進 PIM？</text>
  </g>

  <!-- ===================== 3 上線期 ===================== -->
  <g>
    <rect x="844" y="192" width="360" height="300" rx="14" fill="#FBEADF" stroke="#EFB183" stroke-width="2"/>
    <rect x="844" y="192" width="360" height="6" rx="3" fill="#C2510A"/>

    <circle cx="882" cy="242" r="20" fill="#C2510A"/>
    <text x="882" y="250" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="916" y="250" font-size="28" font-weight="700" fill="#8A3A06">上線期</text>
    <text x="1030" y="249" font-size="18" fill="#C2510A">約 6 週</text>

    <text x="872" y="308" font-size="23" font-weight="600" fill="#1A1A1A">評測 + 監控</text>
    <text x="872" y="342" font-size="18" fill="#4A4A4A">規則層 / Gen AI Evaluation</text>
    <text x="872" y="372" font-size="18" fill="#4A4A4A">回歸測試、日誌</text>

    <line x1="872" y1="404" x2="1176" y2="404" stroke="#EFB183" stroke-width="1.5"/>
    <text x="872" y="440" font-size="16" font-weight="700" fill="#A34408">要回答的問題</text>
    <text x="872" y="470" font-size="20" font-weight="700" fill="#1A1A1A">有沒有變好？</text>
  </g>

  <!-- 進程箭頭 -->
  <line x1="76" y1="546" x2="1204" y2="546" stroke="#8A8A8A" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 一句話，其餘用講的 -->
  <text x="640" y="626" font-size="26" font-weight="700" fill="#8A3A06" text-anchor="middle">多數團隊跳過第三層</text>
</svg>
