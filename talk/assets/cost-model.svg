<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">
  <title>成本估算公式與降本四招</title>
  <desc>生成式 AI 的成本估算公式，以及四種降低成本的手段與其代價</desc>

  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="76" y="97" font-size="38" font-weight="700" fill="#1A1A1A">成本：用公式，不背數字</text>

  <!-- ============ 公式 ============ -->
  <rect x="76" y="140" width="1128" height="150" rx="12" fill="#F5F5F5" stroke="#D8D8D8" stroke-width="2"/>

  <text x="108" y="178" font-size="16" font-weight="700" fill="#8A8A8A">單次成本</text>
  <text x="108" y="214" font-size="23" fill="#1A1A1A" font-family="'SF Mono','Menlo','Consolas',monospace">( in_tokens × 單價_in&#160;&#160;+&#160;&#160;out_tokens × 單價_out ) ÷ 1,000,000</text>

  <line x1="108" y1="236" x2="1172" y2="236" stroke="#D8D8D8" stroke-width="1.5"/>

  <text x="108" y="262" font-size="16" font-weight="700" fill="#8A8A8A">月成本</text>
  <text x="108" y="284" font-size="22" fill="#1A1A1A" font-family="'SF Mono','Menlo','Consolas',monospace">單次 × SKU數 × 重生成次數 × ( 1 + <tspan fill="#C2510A" font-weight="700">judge 開銷比</tspan> )</text>

  <!-- 實測數字，不是勸說 -->
  <rect x="76" y="306" width="1128" height="54" rx="10" fill="#FBEADF" stroke="#EFB183" stroke-width="2"/>
  <text x="640" y="341" font-size="23" fill="#8A3A06" text-anchor="middle">
    <tspan font-weight="700">實測：評審佔總成本 83%</tspan><tspan dx="22">最常被漏算的一筆</tspan>
  </text>

  <!-- ============ 降本四招 ============ -->
  <text x="76" y="416" font-size="28" font-weight="700" fill="#1A1A1A">降本四招</text>

  <text x="96" y="452" font-size="15" font-weight="700" fill="#B8B8B8">手段</text>
  <text x="372" y="452" font-size="15" font-weight="700" fill="#B8B8B8">省下</text>
  <text x="790" y="452" font-size="15" font-weight="700" fill="#B8B8B8">代價</text>

  <g>
    <rect x="76" y="466" width="1128" height="56" rx="8" fill="#F5F5F5"/>
    <text x="96" y="502" font-size="21" font-weight="600" fill="#1A1A1A">1　模型選型降級</text>
    <rect x="372" y="484" width="200" height="21" rx="5" fill="#EF7622"/>
    <text x="588" y="502" font-size="17" fill="#A85110">最大一筆</text>
    <text x="790" y="502" font-size="18" font-weight="700" fill="#8A3A06">要有評測表才敢降</text>
  </g>

  <g>
    <rect x="76" y="528" width="1128" height="56" rx="8" fill="#ffffff"/>
    <text x="96" y="564" font-size="21" font-weight="600" fill="#1A1A1A">2　Batch API</text>
    <rect x="372" y="546" width="130" height="21" rx="5" fill="#EF7622"/>
    <text x="588" y="564" font-size="17" fill="#A85110">約 5 折</text>
    <text x="790" y="564" font-size="18" fill="#4A4A4A">延遲變小時級</text>
  </g>

  <g>
    <rect x="76" y="590" width="1128" height="56" rx="8" fill="#F5F5F5"/>
    <text x="96" y="626" font-size="21" font-weight="600" fill="#1A1A1A">3　Context caching</text>
    <rect x="372" y="608" width="102" height="21" rx="5" fill="#EF7622"/>
    <text x="588" y="626" font-size="17" fill="#A85110">input 折扣</text>
    <text x="790" y="626" font-size="18" fill="#4A4A4A">前綴要夠長</text>
  </g>

  <g>
    <rect x="76" y="652" width="960" height="52" rx="8" fill="#FDF1E6" stroke="#F8C99A" stroke-width="2"/>
    <text x="96" y="686" font-size="21" font-weight="600" fill="#1A1A1A">4　結果快取</text>
    <rect x="372" y="668" width="170" height="21" rx="5" fill="#EF7622"/>
    <text x="588" y="686" font-size="17" font-weight="700" fill="#C2510A">最被低估</text>
    <text x="790" y="686" font-size="18" fill="#4A4A4A">幾乎沒有</text>
  </g>
</svg>
