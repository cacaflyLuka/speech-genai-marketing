  <text x="676.0" y="406.92" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">1. 足量高濃度：每粒含游離型葉黃素 30mg⋯⋯</text>
  <text x="676.0" y="430.92" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">2. 黃金比例：國際認證 5:1 比例，搭配⋯⋯</text>
