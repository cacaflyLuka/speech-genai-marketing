  <text x="676.0" y="310.92" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">晨光研選｜高濃度游離型葉黃素 30mg｜</text>
