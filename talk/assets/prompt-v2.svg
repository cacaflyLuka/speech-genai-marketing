<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">
  <title>v2：加法規與語調</title>
  <desc>v2 加入法規禁詞清單與品牌語調 few-shot。</desc>
  <!-- 由 talk/build_slides.py 產生，不要手改 -->
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="76" y="97" font-size="38" fill="#1A1A1A" font-weight="700">v2　加法規與語調</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">把法規紅線與品牌語氣寫進去：禁詞清單、兩則自家範例</text>
  <rect x="76.0" y="257.2" width="548.0" height="272" rx="10" fill="#ffffff" stroke="#EF7622" stroke-width="2.5"/>
  <rect x="76.0" y="257.2" width="548.0" height="44" rx="10" fill="#FDF1E6" stroke="none" stroke-width="2"/>
  <text x="96.0" y="287.2" font-size="20" fill="#A85110" font-weight="700">法規段落</text>
  <text x="96.0" y="335.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">不得使用下列字詞：</text>
  <rect x="88.0" y="343.2" width="524.0" height="24" rx="4" fill="#FDF1E6" stroke="none" stroke-width="2"/>
  <text x="96.0" y="359.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  治療、預防、改善視力、</text>
  <rect x="88.0" y="367.2" width="524.0" height="24" rx="4" fill="#FDF1E6" stroke="none" stroke-width="2"/>
  <text x="96.0" y="383.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  療效、根治⋯⋯</text>
  <text x="96.0" y="407.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace"></text>
  <text x="96.0" y="431.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">依食安法 §28：</text>
  <rect x="88.0" y="439.2" width="524.0" height="24" rx="4" fill="#FDF1E6" stroke="none" stroke-width="2"/>
  <text x="96.0" y="455.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">宣稱醫療效能</text>
  <rect x="88.0" y="463.2" width="524.0" height="24" rx="4" fill="#FDF1E6" stroke="none" stroke-width="2"/>
  <text x="96.0" y="479.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">罰 60 萬 – 500 萬</text>
  <rect x="656.0" y="257.2" width="548.0" height="272" rx="10" fill="#ffffff" stroke="#1B6FB8" stroke-width="2.5"/>
  <rect x="656.0" y="257.2" width="548.0" height="44" rx="10" fill="#E9F2FB" stroke="none" stroke-width="2"/>
  <text x="676.0" y="287.2" font-size="20" fill="#12507F" font-weight="700">品牌語調 few-shot</text>
  <text x="676.0" y="335.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">範例一</text>
  <text x="676.0" y="359.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  緩釋B群錠 90錠 全素可食</text>
  <text x="676.0" y="383.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  8種B群一次補齊，緩釋設計</text>
  <text x="676.0" y="407.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace"></text>
  <text x="676.0" y="431.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">範例二</text>
  <text x="676.0" y="455.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  甘胺酸鎂錠 120錠 睡前補充</text>
  <text x="676.0" y="479.2" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  選用好吸收的螯合形式</text>
