<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">
  <title>v2：加法規與語調</title>
  <desc>v2 加入法規禁詞清單與品牌語調 few-shot。</desc>
  <!-- 由 talk/build_slides.py 產生，不要手改 -->
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="76" y="97" font-size="38" fill="#1A1A1A" font-weight="700">v2　加法規與語調</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">把法規紅線與品牌語氣寫進去：禁詞清單、兩則自家範例</text>
  <rect x="76.0" y="200.76" width="548.0" height="368" rx="10" fill="#ffffff" stroke="#EF7622" stroke-width="2.5"/>
  <rect x="76.0" y="200.76" width="548.0" height="44" rx="10" fill="#FDF1E6" stroke="none" stroke-width="2"/>
  <text x="96.0" y="230.76" font-size="20" fill="#A85110" font-weight="700">v2 新增（標色部分）</text>
  <text x="96.0" y="278.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">【法規限制 —— 違反會被開罰】</text>
  <text x="96.0" y="302.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">本商品受《食品安全衛生管理法》第 28 條規範。</text>
  <rect x="88.0" y="310.76" width="524.0" height="24" rx="4" fill="#FDF1E6" stroke="none" stroke-width="2"/>
  <text x="96.0" y="326.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">不可出現：治療、改善視力、療效、根治⋯⋯</text>
  <text x="96.0" y="350.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">（依商品類別帶入，這一類共 93 個禁詞）</text>
  <text x="96.0" y="374.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace"></text>
  <text x="96.0" y="398.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">【品牌語調】</text>
  <text x="96.0" y="422.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">溫和、專業、不誇大，訴求日常持續補充</text>
  <text x="96.0" y="446.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">以下是本品牌既有的合規文案，請模仿：</text>
  <rect x="88.0" y="454.76" width="524.0" height="24" rx="4" fill="#FDF1E6" stroke="none" stroke-width="2"/>
  <text x="96.0" y="470.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  晨光研選 緩釋B群錠 90錠 每日一錠 全素可食</text>
  <rect x="88.0" y="478.76" width="524.0" height="24" rx="4" fill="#FDF1E6" stroke="none" stroke-width="2"/>
  <text x="96.0" y="494.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">  晨光研選 甘胺酸鎂錠 120錠 睡前補充</text>
  <rect x="656.0" y="200.76" width="548.0" height="368" rx="10" fill="#ffffff" stroke="#D8D8D8" stroke-width="2.5"/>
  <rect x="656.0" y="200.76" width="548.0" height="44" rx="10" fill="#F5F5F5" stroke="none" stroke-width="2"/>
  <text x="676.0" y="230.76" font-size="20" fill="#8A8A8A" font-weight="700">產出</text>
  <text x="676.0" y="278.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">### 商品標題</text>
  <rect x="668.0" y="286.76" width="524.0" height="24" rx="4" fill="#F5F5F5" stroke="none" stroke-width="2"/>
  <text x="676.0" y="302.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">晨光研選 金盞花游離型葉黃素膠囊 30mg 60粒</text>
  <text x="676.0" y="326.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace"></text>
  <text x="676.0" y="350.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">### 賣點（4 條）</text>
  <text x="676.0" y="374.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">1. 足量游離型葉黃素 30mg，吸收率佳。</text>
  <text x="676.0" y="398.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">2. 採用葉黃素：玉米黃素 5:1 黃金比例。</text>
  <text x="676.0" y="422.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">3. 專為長時間使用螢幕的上班族設計。</text>
  <text x="676.0" y="446.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">4. 每盒 60粒，每日一粒，持續補充兩個月。</text>
  <text x="676.0" y="470.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace"></text>
  <text x="676.0" y="494.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">### 標籤</text>
  <text x="676.0" y="518.76" font-size="15" fill="#4A4A4A" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK TC',monospace">葉黃素、游離型葉黃素、眼部保養、30mg</text>
  <line x1="76" y1="602.76" x2="1204" y2="602.76" stroke="#D8D8D8" stroke-width="1.5"/>
  <text x="76" y="638.76" font-size="21" fill="#8A8A8A">禁詞給清單，語調給範例 —— 都是直接給，不是用形容的。</text>
</svg>
