<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans TC',sans-serif">
  <title>真實的 rubric 清單</title>
  <desc>從商品資料生成的驗收清單，v0～v3 共用同一份。</desc>
  <!-- 由 talk/build_slides.py 產生，不要手改 -->
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="76" y="97" font-size="38" fill="#1A1A1A" font-weight="700">每個商品一份驗收清單</text>
  <text x="76" y="136" font-size="20" fill="#8A8A8A">只看商品資料生成，不看被評的文案 —— v0～v3 共用同一份考卷</text>
  <circle cx="94" cy="218.0" r="18" fill="#1B6FB8"/>
  <text x="94" y="225.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="132" y="214.0" font-size="26" fill="#1A1A1A" font-weight="700">文案是否寫出「游離型」？</text>
  <text x="132" y="246.0" font-size="19" fill="#4A4A4A">規格</text>
  <text x="1204" y="220.0" font-size="20" fill="#1B6FB8" font-weight="700" text-anchor="end">★ 未過就不該上架</text>
  <circle cx="94" cy="293.2" r="18" fill="#1B6FB8"/>
  <text x="94" y="300.2" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="132" y="289.2" font-size="26" fill="#1A1A1A" font-weight="700">是否寫出含量 30mg？</text>
  <text x="132" y="321.2" font-size="19" fill="#4A4A4A">規格</text>
  <text x="1204" y="295.2" font-size="20" fill="#1B6FB8" font-weight="700" text-anchor="end">★ 未過就不該上架</text>
  <circle cx="94" cy="368.4" r="18" fill="#1B6FB8"/>
  <text x="94" y="375.4" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="132" y="364.4" font-size="26" fill="#1A1A1A" font-weight="700">是否提及全素可食？</text>
  <text x="132" y="396.4" font-size="19" fill="#4A4A4A">規格</text>
  <circle cx="94" cy="443.6" r="18" fill="#1B6FB8"/>
  <text x="94" y="450.6" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="132" y="439.6" font-size="26" fill="#1A1A1A" font-weight="700">語氣是否克制、無誇大？</text>
  <text x="132" y="471.6" font-size="19" fill="#4A4A4A">語調</text>
  <circle cx="94" cy="518.8" r="18" fill="#1B6FB8"/>
  <text x="94" y="525.8" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <text x="132" y="514.8" font-size="26" fill="#1A1A1A" font-weight="700">四條賣點是否各自獨立？</text>
  <text x="132" y="546.8" font-size="19" fill="#4A4A4A">結構</text>
  <line x1="76" y1="604" x2="1204" y2="604" stroke="#D8D8D8" stroke-width="1.5"/>
  <text x="76" y="638" font-size="21" fill="#8A8A8A">若讓評審看著文案即興出題，等於每個版本考不同的考卷 —— 那張表就沒有意義了。</text>
</svg>
