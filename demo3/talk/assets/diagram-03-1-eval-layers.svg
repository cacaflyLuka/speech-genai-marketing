<?xml version="1.0" encoding="UTF-8"?>
<!--
id: diagram-03-1
type: diagram
title: eval-layers
description: 三層評測由下而上越來越貴,所以越下層越該多跑
diagram-type: 分層圖
status: done
created: 2026-08-18
updated: 2026-08-19
section: section-03
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 450" width="740" height="450" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <rect width="740" height="450" fill="#ffffff"/>

  <!-- 頂:人工層 -->
  <rect x="182" y="30" width="296" height="106" rx="8" fill="#ffffff" stroke="#1b6fb8" stroke-width="2"/>
  <text x="330" y="66" text-anchor="middle" font-size="23" fill="#1b6fb8" font-weight="700">人工層</text>
  <text x="330" y="96" text-anchor="middle" font-size="19" fill="#1f2933">最貴、最慢</text>
  <text x="330" y="122" text-anchor="middle" font-size="19" fill="#6b7280">抽樣校準前兩層</text>

  <!-- 中:評審層 -->
  <rect x="96" y="150" width="468" height="106" rx="8" fill="#eef4fa" stroke="#1b6fb8" stroke-width="2"/>
  <text x="330" y="186" text-anchor="middle" font-size="23" fill="#1b6fb8" font-weight="700">評審層(LLM judge)</text>
  <text x="330" y="216" text-anchor="middle" font-size="19" fill="#1f2933">有成本、看語意</text>
  <text x="330" y="242" text-anchor="middle" font-size="19" fill="#6b7280">二元 rubric,每次改版跑</text>

  <!-- 底:規則層 -->
  <rect x="10" y="270" width="640" height="106" rx="8" fill="#eef4fa" stroke="#1b6fb8" stroke-width="3"/>
  <text x="330" y="306" text-anchor="middle" font-size="23" fill="#1b6fb8" font-weight="700">規則層</text>
  <text x="330" y="336" text-anchor="middle" font-size="19" fill="#1f2933">本機、免費、毫秒級</text>
  <text x="330" y="362" text-anchor="middle" font-size="19" fill="#6b7280">每一筆都跑,擋掉法規風險</text>

  <!-- 右側箭頭:成本由下而上遞增 -->
  <g stroke="#ef7622" stroke-width="2" fill="none">
    <path d="M700 366 V56"/>
  </g>
  <polygon points="700,42 694,56 706,56" fill="#ef7622"/>
  <text x="730" y="424" text-anchor="end" font-size="18" fill="#ef7622" font-weight="700">越上層越貴,所以跑得越少</text>
</svg>
