  <text x="780" y="84" font-size="26" fill="#1f2a37" text-anchor="middle" font-weight="700" id="label-fa-gui-yu-yu-diao" data-role="label">法規與語調</text>
  <circle cx="780" cy="160" r="42" fill="#6da3d3" stroke="#ffffff" stroke-width="6" id="node-v2" data-role="node" data-layer="row-1" />
