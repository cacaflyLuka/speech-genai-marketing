  <text x="520" y="84" font-size="26" fill="#1f2a37" text-anchor="middle" font-weight="700" id="label-tong-lu-yue-shu" data-role="label">通路約束</text>
  <circle cx="520" cy="160" r="42" fill="#9cc2e2" stroke="#ffffff" stroke-width="6" id="node-v1" data-role="node" data-layer="row-1" />
  <text x="520" y="171" font-size="30" fill="#1f2a37" text-anchor="middle" font-weight="700" id="node-v1-label" data-role="label">v1</text>
