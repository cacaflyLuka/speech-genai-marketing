  <line x1="140" y1="160" x2="1160" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-right)" id="axis-timeline" data-role="unknown" />

  
  <text x="260" y="84" font-size="26" fill="#1f2a37" text-anchor="middle" font-weight="700" id="label-shen-me-dou-bu-gei" data-role="label">什麼都不給</text>
  <circle cx="260" cy="160" r="42" fill="#cfe0f0" stroke="#ffffff" stroke-width="6" id="node-v0" data-role="node" data-layer="row-1" />
