  <path d="M 260 184 C 300 184 300 104 340 104" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ch-arrow)" id="edge-product-gui-ge-to-xia-pi" data-role="edge" data-from="node-product-gui-ge" data-to="node-xia-pi" />
